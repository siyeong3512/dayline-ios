name: Dayline
options:
  bundleIdPrefix: app.dayline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Dayline:
    type: application
    platform: iOS
    sources:
      - path: Dayline
      - path: Shared
    dependencies:
      - target: DaylineWidgets
        embed: true
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dayline.ios
        PRODUCT_NAME: Dayline
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_ENTITLEMENTS: Dayline/Dayline.entitlements
    info:
      path: Dayline/Info.plist
      properties:
        CFBundleDisplayName: 핑
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserActivityTypes:
          - INSendMessageIntent
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [app.dayline.ios.tick, app.dayline.ios.cyber]
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleURLTypes:
          - CFBundleURLName: app.dayline.ios
            CFBundleURLSchemes:
              - pingapp
        UIFileSharingEnabled: false

  # 잠금화면·다이내믹 아일랜드 라이브 액티비티
  DaylineWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DaylineWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dayline.ios.widgets
        PRODUCT_NAME: DaylineWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        CODE_SIGN_ENTITLEMENTS: DaylineWidgets/DaylineWidgets.entitlements
    info:
      path: DaylineWidgets/Info.plist
      properties:
        CFBundleDisplayName: 핑
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
