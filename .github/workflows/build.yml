name: Build & publish Dayline

# main에 push하면: Mac 서버에서 빌드 → GitHub Release에 IPA 업로드 → SideStore 소스(source.json) 갱신
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, SideStore signs it on the phone)
        run: |
          xcodebuild -project Dayline.xcodeproj -scheme Dayline -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || true
          grep -E "warning: .*/Dayline/|BUILD (SUCCEEDED|FAILED)" xcodebuild.log | sort -u | head -80 || true
          if ! grep -q "BUILD SUCCEEDED" xcodebuild.log; then
            echo "::error::빌드 실패 — 아래 error 줄과 xcodebuild-log 아티팩트를 확인하세요"
            grep -n "error:" xcodebuild.log | head -60
            exit 1
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Dayline.app
          test -f "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Dayline.ipa Payload
          ls -lh Dayline.ipa

      - name: Make SideStore source
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git log -1 --pretty=%s > notes.txt
          python3 - <<'PY'
          import json, os, datetime
          repo, owner = os.environ["REPO"], os.environ["OWNER"]
          version, build = os.environ["VERSION"], os.environ["BUILD"]
          notes = open("notes.txt", encoding="utf-8").read().strip() or "Dayline 업데이트"
          size = os.path.getsize("Dayline.ipa")
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          ipa = f"https://github.com/{repo}/releases/download/v{version}/Dayline.ipa"
          icon = f"https://raw.githubusercontent.com/{repo}/main/Dayline/Assets.xcassets/AppIcon.appiconset/icon-dark.png"
          app = {
              "name": "Dayline",
              "bundleIdentifier": "app.dayline.ios",
              "developerName": owner,
              "subtitle": "시간표 · 일정 · 할 일",
              "localizedDescription": "고정 시간표, 약속, 반복 할 일을 한곳에서. 앱을 닫아도 아이폰이 직접 잔소리 알림을 보내요.",
              "iconURL": icon,
              "tintColor": "6c8ee8",
              "category": "productivity",
              "versions": [{
                  "version": version,
                  "buildVersion": build,
                  "date": date,
                  "localizedDescription": notes,
                  "downloadURL": ipa,
                  "size": size,
                  "minOSVersion": "17.0",
              }],
              # 옛 AltStore/SideStore 버전 호환용
              "version": version,
              "versionDate": date,
              "versionDescription": notes,
              "downloadURL": ipa,
              "size": size,
              "appPermissions": {"entitlements": [], "privacy": {}},
          }
          source = {
              "name": "Dayline",
              "identifier": "app.dayline.source",
              "sourceURL": f"https://github.com/{repo}/releases/latest/download/source.json",
              "iconURL": icon,
              "apps": [app],
              "news": [],
          }
          json.dump(source, open("source.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(source, ensure_ascii=False, indent=2))
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" Dayline.ipa source.json \
            --title "Dayline $VERSION" --notes-file notes.txt --latest
